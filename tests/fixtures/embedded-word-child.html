<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地 Word 多页阅读器</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;background:#e6ebf2;color:#172033}.toolbar{height:36px;padding:6px 12px;background:#f8fbff;border-bottom:1px solid #a4b8d7}.doc-outer{height:calc(100% - 60px);overflow:hidden}.doc-shell{height:100%;overflow:hidden}#wordScroll{height:100%;overflow:auto;padding:14px;background:#dae2ec}.page{min-height:480px;max-width:760px;margin:0 auto 16px;padding:32px 42px;background:white;border:1px solid #b9c5d7;box-shadow:0 2px 6px #17203316}.page h1{font-size:22px;margin:0 0 20px}.page p{font-size:16px;line-height:1.9;margin:0 0 16px}.status{height:24px;padding:3px 12px;white-space:nowrap;font-size:11px}.shell-frame{display:block;width:100%;height:100%;border:0}canvas{display:block;width:100%;height:auto}.loading{padding:20px;background:white}

</style></head><body><div id="surface"></div><script src="embedded-word-child.js"></script><script src="/shared.js"></script><script src="/content.js"></script></body></html>
