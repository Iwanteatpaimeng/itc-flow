<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正文与目录滚动隔离验证</title><style>
*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:1550px;background:#edf2f8;color:#172033;font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}header{position:fixed;z-index:10;inset:0 0 auto;padding:10px 18px;background:#fffffffa;border-bottom:1px solid #9fb1ca}header strong{font-size:17px}button{font:inherit;background:white;border:1px solid #9fb1ca;border-radius:6px;padding:5px 10px;margin:5px 6px 5px 0}output{display:block;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}#catalogCourseFrame{position:absolute;top:370px;left:20px;width:calc(100% - 40px);height:520px;border:1px solid #9fb1ca;background:white}#catalogTrace{position:absolute;top:1000px;left:20px;right:20px;padding:12px;background:#172033;color:#dbeafe;min-height:140px}body.course-frame{min-height:100%;height:100%;overflow:hidden;background:white}.reader-web{height:100%;display:flex;overflow:hidden}.reader-left{width:320px;flex:none;height:100%;overflow:hidden;border-right:1px solid #cad5e5;background:#f8fafc}.catalog-heading{height:43px;padding:9px 16px;font-weight:bold}.el-scrollbar__wrap{height:calc(100% - 43px);overflow:auto;padding:0 13px}.catalog-thumb{display:block;width:260px;height:170px}.catalog-item-row{margin:0;padding:12px 8px;border-bottom:1px solid #edf1f7;font-size:13px}.reader-right{flex:1;min-width:0;height:100%;overflow:hidden}.reader-toolbar{height:43px;border-bottom:1px solid #cad5e5;padding:9px 20px;color:#687b94}#reader-container,#plain-reader{height:calc(100% - 43px);overflow:auto;padding:22px 32px;overflow-anchor:none}.reader-chapter-content{overflow:visible;font-size:16px;line-height:1.9}.reader-chapter-content h1{font-size:23px;margin:0 0 20px}.reader-chapter-content p{margin:0 0 26px}#childDiagnostic{position:absolute;right:18px;bottom:8px;max-width:55%;background:#e6f0ffff;padding:3px 8px;pointer-events:none;font-size:11px}a{color:#1f5bc8}
</style></head><body>
<header><strong>真实 content.js：只滚右侧正文，左侧目录保持 180px</strong><div><button data-action="start">开始正文验证</button><button data-action="pause">暂停</button><button data-action="resume">继续</button><button data-action="restart">重新开始</button><button data-action="stop">停止</button></div><output id="catalogState">等待开始</output><output id="catalogGeometry">正在连接课程框架</output><output id="catalogIdentity">等待运行标识</output><output id="catalogTiming">等待滚动倒计时</output><output id="catalogResult">等待验证</output></header>
<iframe id="catalogCourseFrame" style="height:460px" title="目录与正文分别滚动的虚构课程"></iframe><output id="catalogTrace">本地虚构内容；通过实际 ENGINE_EMBEDDED_RUN 进入内嵌课程。</output>
<script src="catalog-reader.js"></script><script src="/shared.js"></script><script src="/content.js"></script></body></html>
