<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嵌套 Word 连续阅读验证</title>
<style>
*{box-sizing:border-box}html{height:100%;overflow:visible}body{margin:0;min-height:1450px;color:#172033;background:#edf2f8;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}header{position:fixed;z-index:20;inset:0 0 auto;background:#f8fbfffa;border-bottom:1px solid #a4b8d7;padding:8px 16px}header strong{font-size:15px}button,input{font:inherit}button{padding:4px 8px;margin:3px 5px 3px 0;border:1px solid #92abd0;border-radius:5px;background:white}header label{margin-right:10px;font-size:12px}output{display:block;white-space:pre-wrap;font-size:11px;overflow-wrap:anywhere}.reader-web{position:absolute;top:300px;left:16px;width:1000px;height:704px;transform:scale(.72);transform-origin:top left}.reader-wrapper{height:100%;padding-top:20px;overflow:hidden;background:white;border:1px solid #a4b8d7}#reader-container{height:664px;overflow-x:hidden;overflow-y:auto;padding:18px 24px;border:2px solid #3974df;overflow-anchor:none}.reader-chapter-content{overflow:visible;font-size:16px;line-height:1.8}.reader-chapter-content h1{font-size:21px;margin:0 0 16px}.reader-chapter-content h2{font-size:19px;margin:24px 0 16px}.reader-chapter-content p{margin:0 0 22px}.insertH5{display:block;width:100%;height:600px;border:1px solid #93a9cc;background:#f1f5fa}.document-row{margin:22px 0}.trace-panel{position:fixed;z-index:15;right:12px;top:210px;bottom:16px;width:310px;overflow:auto;background:#172033;color:#dbeafe;padding:10px;font:11px/1.5 monospace}.after-note{position:absolute;top:1200px;left:18px;color:#5b6b84}.not-fit .reader-web{transform:none}@media(max-width:1050px){.reader-web{width:880px;transform:scale(.65)}.trace-panel{width:240px;top:220px}}
</style></head><body>
<header><strong>文字 → 嵌套 Word → 后续文字（真实 content.js）</strong><div><button data-action="start">开始嵌套文档验证</button><button data-action="pause">暂停</button><button data-action="resume">继续</button><button data-action="restart">重新开始</button><button data-action="stop">停止</button><button id="renewSource">更新 Word 地址参数（测试）</button></div><label><input id="complete" type="checkbox">本地平台确认完成</label><label><input id="reloadOnEnter" type="checkbox">进入 Word 时刷新临时地址一次</label><output id="wordState">等待开始</output><output id="wordIdentity">等待运行标识</output><output id="wordGeometry">正在读取布局</output><output id="wordChild">等待 Word 子页面连接</output><output id="wordTiming">等待计时</output></header>
<div class="reader-web"><div class="reader-wrapper"><div id="reader-container" class="reader-container"><div id="reader-chapter-box"><div id="word-chapter-one" class="reader-chapter-content w-e-text"><h1>虚构教材：数据记录与文档</h1><section id="intro" data-reading="Word 之前的正文"></section><div class="document-row"><iframe id="FKNBPCW33J" class="insertH5 cres" title="Word 文档 · 本地虚构内容"></iframe></div><section id="tail" data-reading="Word 之后的正文"></section><strong id="wordCompleteMarker" hidden>本地完成标记</strong></div></div></div></div>
<output id="wordTrace" class="trace-panel">只使用本地虚构文本；所有滚动与返回来自真实内容脚本。</output><div class="after-note">外层页面保留初始 149px；阅读器与 Word 使用各自的滚动组件。</div>
<script src="embedded-word.js"></script><script src="/shared.js"></script><script src="/content.js"></script></body></html>
