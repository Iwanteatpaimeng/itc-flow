<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>桌面教材双层 iframe 验证</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font:12px/1.5 "Segoe UI",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}header{position:fixed;z-index:20;inset:0 0 auto;padding:10px 16px;background:#eff5fffa;border-bottom:1px solid #80a4dc}button{margin:4px 6px 4px 0;padding:5px 9px}output{display:block}#framesTrace{position:fixed;right:20px;bottom:20px;z-index:25;max-height:150px;max-width:420px;overflow:auto;white-space:pre-wrap;background:#101827ed;color:#dbeafe;padding:10px;pointer-events:none}</style></head>
<body><iframe id="desktopFrame" title="桌面教材框架" allow="autoplay"></iframe><header id="framesControls"><strong>桌面教材双层 iframe：祖先只做真实播放器投影确认</strong><div><button data-action="start">开始双层框架教材</button><button data-action="pause">暂停</button><button data-action="resume">继续</button><button data-action="restart">重新开始</button><button data-action="stop">停止</button></div><output id="framesState">等待开始</output><output id="framesGeometry">尚未播放</output></header><output id="framesTrace">测试框架不含真实课程内容或远程媒体</output>
<script src="desktop-textbook-frames.js"></script><script src="/shared.js"></script><script src="/content.js"></script></body></html>
